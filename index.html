<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Planner</title>
<meta name="theme-color" content="#E9ECF0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">
  <div id="scaler">
    <div id="page">
      <div id="grid"></div>
      <div id="legend"></div>
    </div>
  </div>
</main>

<nav id="bar">
  <div id="tabs"></div>
  <div id="tools">
    <button id="bUndo" class="tool" title="Undo" aria-label="Undo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="bOpen" class="tool" title="Open" aria-label="Open">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button id="bSave" class="tool" title="Save" aria-label="Save">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3"/><path d="M7 21v-7h10v7"/></svg>
    </button>
    <button id="bPrint" class="tool" title="Print" aria-label="Print">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>
    </button>
    <button id="bSettings" class="tool" title="Sheet settings" aria-label="Sheet settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</nav>

<div id="pop" class="pop"></div>

<div id="modal" class="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Sheet settings</h2>
    <label>Name <input id="fName" type="text" autocomplete="off"></label>
    <div class="two">
      <label>First day <input id="fStart" type="date"></label>
      <label>Last day <input id="fEnd" type="date"></label>
    </div>
    <div class="two">
      <label>Day starts <input id="fDayStart" type="time" step="900"></label>
      <label>Day ends <input id="fDayEnd" type="time" step="900"></label>
    </div>
    <label>Slot length
      <select id="fSlot">
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="60">1 hour</option>
      </select>
    </label>
    <p id="fErr" class="err" role="alert"></p>
    <details>
      <summary>Import</summary>
      <label for="fImport" class="sr">Timetable data</label>
      <textarea id="fImport" rows="4" placeholder="Paste copied timetable data"></textarea>
      <button id="fImportBtn" type="button" class="btn">Add as new sheet</button>
    </details>
    <div class="actions">
      <button id="fCancel" type="button" class="btn">Cancel</button>
      <button id="fDone" type="button" class="btn primary">Done</button>
    </div>
  </div>
</div>

<input id="fileIn" type="file" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
